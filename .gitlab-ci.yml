include:
  - component: gitlab.com/gemseo/dev/ci/pipeline@1.1.0

# The tests that need MATLAB are not collected by the test jobs of the component,
# which have no MATLAB. These jobs run the whole test suite with MATLAB,
# whose licenses are only available on the internal GitLab.
.test-matlab:
  stage: pipeline
  needs: []
  image: registry.gitlab.com/gemseo/dev/gemseo-matlab/multi-python-matlab:$MATLAB_VERSION
  tags:
    - saas-linux-small-amd64
  variables:
    UV_PYTHON: "3.11"
    UV_NO_EDITABLE: "1"
  rules:
    - if: $CI_SERVER_HOST == "gitlab.com"
      when: never
    - changes:
        - src/**/*.*
        - tests/**/*.*
        - uv.lock
        - pyproject.toml
        - .justfile
        - .gitlab-ci.yml
        - .pytest.ini
  script:
    - uv sync
    # The MATLAB Engine API for Python must match the version of MATLAB.
    - uv pip install "$MATLAB_PIP_REQ_SPEC"
    # No concurrency, to reduce the number of licenses used.
    - just coverage --verbose

test-matlab-r2023b:
  extends: .test-matlab
  variables:
    MATLAB_VERSION: r2023b
    MATLAB_PIP_REQ_SPEC: matlabengine~=23.2.0

test-matlab-r2024a:
  extends: .test-matlab
  variables:
    MATLAB_VERSION: r2024a
    MATLAB_PIP_REQ_SPEC: matlabengine~=24.1.0
  needs:
    - test-matlab-r2023b

test-matlab-r2023b-windows:
  extends: .test-matlab
  tags:
    - windows-server-2019
  variables:
    MATLAB_VERSION: r2023b
    MATLAB_PIP_REQ_SPEC: matlabengine~=23.2.0
  needs:
    - test-matlab-r2024a
